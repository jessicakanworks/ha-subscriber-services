---
- name: Install FreeRADIUS with SQL module
  ansible.builtin.package: {name: [freeradius, freeradius-utils, freeradius-mysql], state: present}
- name: NAS clients (BNG / VPN concentrators)
  ansible.builtin.template: {src: clients.conf.j2, dest: /etc/freeradius/3.0/clients.conf, mode: "0640", group: freerad}
  notify: restart radius
- name: Enable SQL users/accounting
  ansible.builtin.file: {src: /etc/freeradius/3.0/mods-available/sql, dest: /etc/freeradius/3.0/mods-enabled/sql, state: link}
  notify: restart radius
- ansible.builtin.service: {name: freeradius, state: started, enabled: true}
